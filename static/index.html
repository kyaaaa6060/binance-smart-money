<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ağırlıklı Ortalama — Copy-Trade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-outer: #16181d;
      --bg-modal: #1b1e24;
      --bg-card: #22262e;
      --bg-inner: #181b20;
      --border-subtle: #2c313c;
      --green-glow: #25b878;
      --green-bg: rgba(24, 92, 62, 0.36);
      --green-text: #28d18a;
      --red-bg: rgba(112, 34, 42, 0.34);
      --red-text: #f04856;
      --olive-bg: rgba(96, 88, 34, 0.36);
      --gold-text: #e8b824;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-outer);
      color: #e6ebf2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-shell {
      width: 100%;
      max-width: 780px;
      background-color: var(--bg-modal);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
      overflow: hidden;
    }

    .source-card {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 10px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.15s ease;
      cursor: pointer;
    }

    .source-card:hover {
      border-color: #3f4654;
    }

    .source-card.active {
      border-color: var(--green-glow);
      box-shadow: 0 0 0 1px rgba(37, 184, 120, 0.45), 0 0 22px rgba(37, 184, 120, 0.22);
    }

    .metric-strip-long {
      background: linear-gradient(90deg, rgba(22, 86, 58, 0.44) 0%, rgba(22, 86, 58, 0.24) 100%);
      border: 1px solid rgba(40, 209, 138, 0.14);
      border-radius: 10px;
    }

    .metric-strip-short {
      background: linear-gradient(90deg, rgba(108, 32, 40, 0.44) 0%, rgba(108, 32, 40, 0.24) 100%);
      border: 1px solid rgba(240, 72, 86, 0.14);
      border-radius: 10px;
    }

    .metric-strip-avg {
      background: linear-gradient(90deg, rgba(94, 86, 32, 0.44) 0%, rgba(94, 86, 32, 0.24) 100%);
      border: 1px solid rgba(232, 184, 36, 0.16);
      border-radius: 10px;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="modal-shell">
    <!-- Üst Başlık -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-[#282d37]">
      <div class="flex items-center gap-2.5">
        <span class="inline-flex items-end gap-[2.5px] h-4 w-4 shrink-0" aria-hidden="true">
          <span class="w-[3.5px] h-[7px] rounded-[1px] bg-[#28d18a]"></span>
          <span class="w-[3.5px] h-[14px] rounded-[1px] bg-[#f04856]"></span>
          <span class="w-[3.5px] h-[11px] rounded-[1px] bg-[#3b82f6]"></span>
        </span>
        <h1 class="text-[17px] font-semibold tracking-tight text-white">Ağırlıklı Ortalama</h1>
      </div>

      <div class="flex items-center gap-3">
        <span id="meta-info" class="text-[11px] text-[#8d96a5] tabular-nums hidden sm:inline">
          Yükleniyor...
        </span>
        <button
          id="close-or-refresh-btn"
          type="button"
          title="Verileri Yenile"
          class="w-7 h-7 rounded-md flex items-center justify-center text-[#9aa3b2] hover:text-white hover:bg-white/5 transition text-lg leading-none"
        >
          ×
        </button>
      </div>
    </div>

    <!-- Gövde -->
    <div class="p-5 sm:p-6">
      <div class="text-center text-[13px] font-medium text-[#cbd2de] mb-4">
        Veri Kaynağı Seçin:
      </div>

      <!-- 4 Kaynak / Filtre Kartı -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
        <button type="button" data-source="ALL" class="source-card active py-4 px-3 flex flex-col items-center justify-center gap-2.5">
          <svg class="w-6 h-6 text-[#cbd2de]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7 1a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM3.5 18.5c0-2.5 2.46-4.5 5.5-4.5s5.5 2 5.5 4.5V20h-11v-1.5Zm11.5 1.5v-1.3c0-1.45-.72-2.73-1.82-3.52.72-.12 1.48-.18 2.32-.18 2.48 0 4.5 1.57 4.5 3.5V20h-5Z"/>
          </svg>
          <span class="text-[12.5px] font-medium text-[#e2e7f0]">Copy Liderler</span>
        </button>

        <button type="button" data-source="BINANCE" class="source-card py-4 px-3 flex flex-col items-center justify-center gap-2.5">
          <svg class="w-6 h-6 text-[#cbd2de]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3 4.5 7.2 12 11.4l7.5-4.2L12 3Zm-8.2 6.2v6.6L10.8 20v-6.6L3.8 9.2Zm16.4 0-7 4.2V20l7-4.2V9.2Z"/>
          </svg>
          <span class="text-[12.5px] font-medium text-[#e2e7f0]">Binance</span>
        </button>

        <button type="button" data-source="OKX" class="source-card py-4 px-3 flex flex-col items-center justify-center gap-2.5">
          <svg class="w-6 h-6 text-[#cbd2de]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM9 9h6v6H9V9Zm-5 5h6v6H4v-6Zm10 0h6v6h-6v-6Z"/>
          </svg>
          <span class="text-[12.5px] font-medium text-[#e2e7f0]">OKX</span>
        </button>

        <button type="button" data-source="WHALE_SIZE" class="source-card py-4 px-3 flex flex-col items-center justify-center gap-2.5">
          <svg class="w-6 h-6 text-[#cbd2de]" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 19h2v-6H4v6Zm4.5 0h2V8h-2v11Zm4.5 0h2v-9h-2v9Zm4.5 0h2V5h-2v14Z"/>
          </svg>
          <span class="text-[12.5px] font-medium text-[#e2e7f0]">Büyük Hacim</span>
        </button>
      </div>

      <!-- İç Ana Kutu -->
      <div class="bg-[#232730] border border-[#2e3440] rounded-xl p-4 sm:p-5">
        <!-- Sembol Seçimi -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-4">
          <select
            id="symbol-select"
            aria-label="Parite Seç"
            class="bg-[#1b1e25] border border-[#343b49] rounded-lg px-3.5 py-1.5 text-[15px] font-semibold text-white tracking-wide focus:outline-none focus:border-[#4b5568] tabular-nums"
          >
            <option value="">Veri bekleniyor...</option>
          </select>
        </div>

        <!-- Güncel / Geçmiş Sekmeleri -->
        <div class="grid grid-cols-2 bg-[#1a1d24] p-1 rounded-lg border border-[#2d323e] mb-4">
          <button
            id="tab-current"
            type="button"
            class="py-2 px-3 rounded-md text-[13px] font-semibold flex items-center justify-center gap-2 transition bg-[#eab308] text-[#14161a]"
          >
            <span class="inline-flex items-end gap-[2px] h-3.5 w-3.5" aria-hidden="true">
              <span class="w-[3px] h-[6px] bg-current rounded-[1px]"></span>
              <span class="w-[3px] h-[12px] bg-current rounded-[1px]"></span>
              <span class="w-[3px] h-[9px] bg-current rounded-[1px]"></span>
            </span>
            <span>Güncel</span>
          </button>

          <button
            id="tab-history"
            type="button"
            class="py-2 px-3 rounded-md text-[13px] font-medium flex items-center justify-center gap-2 transition text-[#9aa3b2] hover:text-white"
          >
            <span class="w-3.5 h-3.5 rounded-full bg-[#9aa3b2] text-[#1a1d24] inline-flex items-center justify-center text-[10px] font-bold">
              ↺
            </span>
            <span>Geçmiş</span>
          </button>
        </div>

        <!-- LONG Ort. Giriş Şeridi -->
        <div class="metric-strip-long px-4 py-3.5 mb-3">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="w-3 h-3 rounded-full bg-[#25c97e] shrink-0"></span>
              <span class="text-[14.5px] font-semibold text-[#eef2f7]">LONG Ort. Giriş:</span>
            </div>
            <div id="long-avg-val" class="text-[18px] sm:text-[19px] font-bold text-[#28d18a] tabular-nums">
              —
            </div>
          </div>
          <div id="long-sub-val" class="mt-2 text-[12.5px] text-[#9ca5b4] tabular-nums">
            Açık pozisyon bekleniyor
          </div>
        </div>

        <!-- SHORT Ort. Giriş Şeridi -->
        <div class="metric-strip-short px-4 py-3.5 mb-3">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="w-3 h-3 rounded-full bg-[#ef4444] shrink-0"></span>
              <span class="text-[14.5px] font-semibold text-[#eef2f7]">SHORT Ort. Giriş:</span>
            </div>
            <div id="short-avg-val" class="text-[18px] sm:text-[19px] font-bold text-[#f04856] tabular-nums">
              —
            </div>
          </div>
          <div id="short-sub-val" class="mt-2 text-[12.5px] text-[#9ca5b4] tabular-nums">
            Açık pozisyon bekleniyor
          </div>
        </div>

        <!-- Ortalama Giriş Şeridi -->
        <div class="metric-strip-avg px-4 py-3.5">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="w-3 h-3 rounded-full bg-[#d4d8df] shrink-0"></span>
              <span class="text-[14.5px] font-semibold text-[#eef2f7]">Ortalama Giriş:</span>
            </div>
            <div id="total-avg-val" class="text-[18px] sm:text-[19px] font-bold text-[#e8b824] tabular-nums">
              —
            </div>
          </div>
          <div id="total-sub-val" class="mt-1.5 text-[11.5px] text-[#9ca5b4] tabular-nums hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedSource = "ALL";
    let activeTab = "current";
    let coinsList = [];
    let selectedSymbol = "";

    function formatUSDPrice(num) {
      const n = Number(num || 0);
      if (!n || Number.isNaN(n)) return "—";
      const decimals = n >= 100 ? 2 : n >= 1 ? 4 : 6;
      return "$" + n.toLocaleString("tr-TR", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function formatSizeMillions(vol) {
      const n = Number(vol || 0);
      const millions = n / 1_000_000;
      return "$" + millions.toFixed(2) + "M";
    }

    function computeOverallAvgEntry(coin) {
      if (Number(coin.avg_entry || 0) > 0) {
        return Number(coin.avg_entry);
      }
      const longVol = Number(coin.long_vol || 0);
      const shortVol = Number(coin.short_vol || 0);
      const longAvg = Number(coin.long_avg_entry || 0);
      const shortAvg = Number(coin.short_avg_entry || 0);
      const totalVol = longVol + shortVol;

      if (totalVol <= 0) return 0;
      return (longAvg * longVol + shortAvg * shortVol) / totalVol;
    }

    function populateSymbolSelect(coins) {
      const select = document.getElementById("symbol-select");
      if (!coins.length) {
        selectedSymbol = "";
        select.innerHTML = `<option value="">Açık pozisyon bulunamadı</option>`;
        return;
      }

      if (!selectedSymbol || !coins.some((c) => c.symbol === selectedSymbol)) {
        const btc = coins.find((c) => c.symbol === "BTCUSDT" || c.symbol === "BTC");
        selectedSymbol = btc ? btc.symbol : coins[0].symbol;
      }

      select.innerHTML = coins
        .map((c) => `<option value="${c.symbol}" ${c.symbol === selectedSymbol ? "selected" : ""}>${c.symbol}</option>`)
        .join("");
    }

    function renderCard() {
      const coin = coinsList.find((c) => c.symbol === selectedSymbol);
      const longAvgEl = document.getElementById("long-avg-val");
      const shortAvgEl = document.getElementById("short-avg-val");
      const totalAvgEl = document.getElementById("total-avg-val");
      const longSubEl = document.getElementById("long-sub-val");
      const shortSubEl = document.getElementById("short-sub-val");
      const totalSubEl = document.getElementById("total-sub-val");

      if (!coin) {
        longAvgEl.textContent = "—";
        shortAvgEl.textContent = "—";
        totalAvgEl.textContent = "—";
        longSubEl.textContent = "Seçili filtrede açık işlem yok";
        shortSubEl.textContent = "Seçili filtrede açık işlem yok";
        totalSubEl.classList.add("hidden");
        return;
      }

      const longCount = Number(coin.long_count || 0);
      const shortCount = Number(coin.short_count || 0);
      const longVol = Number(coin.long_vol || 0);
      const shortVol = Number(coin.short_vol || 0);
      const longAvg = Number(coin.long_avg_entry || 0);
      const shortAvg = Number(coin.short_avg_entry || 0);
      const overallAvg = computeOverallAvgEntry(coin);

      longAvgEl.textContent = formatUSDPrice(longAvg);
      shortAvgEl.textContent = formatUSDPrice(shortAvg);
      totalAvgEl.textContent = formatUSDPrice(overallAvg);

      longSubEl.textContent = `(${longCount} işlem, ${formatSizeMillions(longVol)} size)`;
      shortSubEl.textContent = `(${shortCount} işlem, ${formatSizeMillions(shortVol)} size)`;

      if (activeTab === "history") {
        totalSubEl.classList.remove("hidden");
        totalSubEl.textContent = `(${longCount + shortCount} toplam işlem, ${formatSizeMillions(longVol + shortVol)} toplam size • anlık özet)`;
      } else {
        totalSubEl.classList.add("hidden");
      }
    }

    async function fetchPositions() {
      const exchangeParam = selectedSource === "OKX" ? "OKX" : selectedSource === "BINANCE" ? "BINANCE" : "ALL";
      try {
        const res = await fetch(`/api/positions?exchange=${encodeURIComponent(exchangeParam)}`);
        const data = await res.json();

        let coins = Array.isArray(data.coins) ? data.coins : [];
        if (selectedSource === "WHALE_SIZE") {
          coins = [...coins].sort((a, b) => Number(b.total_vol || 0) - Number(a.total_vol || 0));
        }

        coinsList = coins;
        populateSymbolSelect(coinsList);
        renderCard();

        const metaEl = document.getElementById("meta-info");
        metaEl.textContent = `${data.last_updated || "Taranıyor..."} · ${data.visible_leaders ?? 0} aktif lider · ${coinsList.length} coin`;
      } catch (e) {
        document.getElementById("meta-info").textContent = "Bağlantı hatası";
      }
    }

    document.querySelectorAll(".source-card").forEach((card) => {
      card.addEventListener("click", () => {
        selectedSource = card.getAttribute("data-source");
        document.querySelectorAll(".source-card").forEach((c) => c.classList.remove("active"));
        card.classList.add("active");
        fetchPositions();
      });
    });

    document.getElementById("symbol-select").addEventListener("change", (e) => {
      selectedSymbol = e.target.value;
      renderCard();
    });

    const tabCurrent = document.getElementById("tab-current");
    const tabHistory = document.getElementById("tab-history");

    tabCurrent.addEventListener("click", () => {
      activeTab = "current";
      tabCurrent.className = "py-2 px-3 rounded-md text-[13px] font-semibold flex items-center justify-center gap-2 transition bg-[#eab308] text-[#14161a]";
      tabHistory.className = "py-2 px-3 rounded-md text-[13px] font-medium flex items-center justify-center gap-2 transition text-[#9aa3b2] hover:text-white";
      renderCard();
    });

    tabHistory.addEventListener("click", () => {
      activeTab = "history";
      tabHistory.className = "py-2 px-3 rounded-md text-[13px] font-semibold flex items-center justify-center gap-2 transition bg-[#eab308] text-[#14161a]";
      tabCurrent.className = "py-2 px-3 rounded-md text-[13px] font-medium flex items-center justify-center gap-2 transition text-[#9aa3b2] hover:text-white";
      renderCard();
    });

    document.getElementById("close-or-refresh-btn").addEventListener("click", fetchPositions);

    fetchPositions();
    setInterval(fetchPositions, 15000);
  </script>
</body>
</html>
